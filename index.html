<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L’Oréal | Routine Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <img src="img/loreal-logo.png" alt="L’Oréal" class="logo">
      <h1>Your products. Your routine.</h1>
      <button id="directionToggle" type="button" aria-pressed="false">
        RTL layout
      </button>
    </header>

    <main>
      <section aria-label="Browse products">
        <div class="search-section">
          <label>
            Search products
            <input id="productSearch" type="search"
              placeholder="Search by product, brand, or ingredient…">
          </label>
          <label>
            Category
            <select id="categoryFilter">
              <option value="">All categories</option>
            </select>
          </label>
        </div>
        <p id="productStatus" role="status">Loading products…</p>
        <div id="productsContainer" class="products-grid"></div>
      </section>

      <section class="selected-products" aria-labelledby="selectedHeading">
        <div class="section-heading">
          <h2 id="selectedHeading">Selected products</h2>
          <button id="clearSelections" type="button">Clear all</button>
        </div>
        <ul id="selectedProductsList"></ul>
        <label for="preferences">Your preferences (optional)</label>
        <textarea id="preferences" rows="2"
          placeholder="Tell us your skin or hair type, goals, or preferences…"></textarea>
        <button id="generateRoutine" class="primary-button" type="button" disabled>
          Generate routine
        </button>
      </section>

      <section class="chatbox" aria-labelledby="chatHeading">
        <h2 id="chatHeading">Your routine advisor</h2>
        <div id="chatWindow" class="chat-window" role="log"
          aria-live="polite" aria-label="Conversation"></div>
        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden">Follow-up question</label>
          <input id="userInput" type="text" required
            placeholder="Ask about your routine…" autocomplete="off">
          <button id="sendBtn" class="primary-button" type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      Student project using L’Oréal brand product data.
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
